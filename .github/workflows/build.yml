name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: voltune-debug.jks
          key: voltune-debug-keystore-v2

      - name: Create debug keystore
        run: |
          if [ ! -f voltune-debug.jks ]; then
            keytool -genkeypair -keystore voltune-debug.jks \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Voltune Debug,O=Voltune,C=NP"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voltune-debug
          path: app/build/outputs/apk/debug/*.apk
